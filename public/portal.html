<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal de familias</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23E9A23B'/%3E%3Cpath d='M8 21l5-5 4 3 7-8' stroke='%2312303B' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .portal { max-width: 860px; margin: 0 auto; padding: 0 16px 60px; }
    .portal-top { background: var(--brand); color: var(--brand-ink); }
    .portal-top .in { max-width: 860px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .hero { background: var(--brand); color: var(--brand-ink); padding: 8px 0 72px; }
    .hero .in { max-width: 860px; margin: 0 auto; padding: 0 16px; }
    .hero h1 { font-size: 30px; }
    .hero p { opacity: .8; margin: 6px 0 0; }
    .lift { margin-top: -52px; }
    .login { max-width: 420px; margin: 60px auto; }
    .tot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 14px; margin-top: 8px; }
    .tot b { font-size: 22px; }
    td input[type=checkbox] { width: 18px; height: 18px; }
    .portal-top .btn { color: var(--brand-ink); border-color: rgba(255,255,255,.3); background: transparent; }
  </style>
</head>
<body>
  <div class="portal-top"><div class="in"><b id="escuela">Portal de familias</b><button class="btn sm" id="salir" hidden>Salir</button></div></div>
  <div id="app"></div>
  <dialog id="modal"></dialog>
  <script src="/portal.js"></script>
</body>
</html>
